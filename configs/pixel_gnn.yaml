# Pixel GNN - moi pixel la 1 node, canh noi 8-neighbor, message dung delta.
_base_: "base.yaml"

model:
  name: "pixel_gnn"

  # Pixel graph
  hidden_dim: 128
  num_layers: 3

  # Pixel motif hierarchy:
  # 2304 pixel nodes -> motif_vector [B, 2304, 17]
  # -> soft assignment -> K motif/semantic nodes -> region GNN -> classifier
  use_motif_hierarchy: true
  num_motif_nodes: 12
  region_gnn_layers: 2
  region_tau: 0.2
  pool_loss_weight: 0.01
  region_prior_strength: 1.0
  region_prior_loss_weight: 0.05
  region_balance_loss_weight: 0.1
  motif_entropy_loss_weight: 1.0

  # Regularization
  dropout: 0.3

data:
  image_size: 48
  channels: 1
  # Global batch size. With DDP 2 GPU, each GPU receives 8 samples.
  batch_size: 16

training:
  lr: 0.001
  epochs: 300
  optimizer: "adamw"
  weight_decay: 0.0001
  label_smoothing: 0.1
  scheduler: "cosine"
  use_class_weights: false
  patience: 20

env:
  platform: "kaggle"

ddp:
  # Use torchrun --nproc_per_node=2. train.py will split data with DistributedSampler.
  batch_size_is_global: true
  find_unused_parameters: false
  broadcast_buffers: true
  sync_batchnorm: false

kaggle:
  data_path: "/kaggle/input/datasets/doduyquynii/fer13-split/fer13-split"
  root_path: "/kaggle/working/sgu-2026-facial-expression-recognition"
