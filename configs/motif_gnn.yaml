
# Motif GNN – Pixel → Graph → SubGraph → FER
_base_: "base.yaml"

model:
  name: "motif_gnn"

  # -- Graph construction --
  window_size: 5          # kích thước patch (5×5 pixels = 1 node)
  stride: 2               # bước nhảy cửa sổ trượt (→ 529 nodes từ ảnh 48x48)

  # -- GCN --
  hidden_dim: 128         # chiều ẩn của GCN và SubGraph

  # -- SubGraph Pooling --
  num_subgraphs: 6        # số subgraph: Trán, Mắt trái, Mắt phải, Mũi, Miệng, Cằm
  num_heads: 4            # đầu trong inter-subgraph Self-Attention

  # -- Regularization --
  dropout: 0.3
  pool_loss_weight: 0.01  # trọng số của entropy pooling loss

data:
  image_size: 48
  channels: 1
  batch_size: 64

training:
  lr: 0.001
  finetune_lr: 0.0001
  epochs: 100
  optimizer: "adamw"
  weight_decay: 0.0001
  label_smoothing: 0.1
  scheduler: "cosine"
  use_class_weights: true
  patience: 20

env:
  platform: "kaggle"

kaggle:
  data_path: "/kaggle/input/datasets/doduyquynii/fer13-split/fer13-split"
  root_path: "/kaggle/working/sgu-2026-facial-expression-recognition"
