
# Motif GNN – Pixel → Graph → SubGraph → FER
_base_: "base.yaml"

model:
  name: "motif_gnn"

  # -- Graph construction --
  window_size: 5          # kích thước patch (5×5 pixels = 1 node)
  stride: 2               # bước nhảy cửa sổ trượt (→ 529 nodes từ ảnh 48x48)

  # -- GCN --
  hidden_dim: 128         # chiều ẩn của GCN và SubGraph
  alpha: 0.5              # Giá trị khởi tạo cho alpha học được: alpha*A_spatial + (1-alpha)*A_cos
  spatial_sigma: 2.0      # Độ cong của Gaussian Kernel cho khoảng cách không gian

  # -- SubGraph Pooling --
  num_subgraphs: 6        # số subgraph: Trán, Mắt trái, Mắt phải, Mũi, Miệng, Cằm
  num_heads: 4            # đầu trong inter-subgraph Self-Attention
  region_prior_strength: 1.0       # độ mạnh bias vị trí cho 6 vùng mặt
  region_prior_loss_weight: 0.05   # giữ assignment không trôi khỏi vùng mặt kỳ vọng
  region_balance_loss_weight: 0.1  # chống collapse tất cả patch vào 1-2 vùng

  # -- Regularization --
  dropout: 0.3
  pool_loss_weight: 0.001       # trọng số của toàn cục pool_loss
  align_loss_weight: 0.1        # (Option C) Trọng số ép Semantic Alignment

data:
  image_size: 48
  channels: 1
  batch_size: 64

training:
  lr: 0.001
  finetune_lr: 0.0001
  epochs: 300
  optimizer: "adamw"
  weight_decay: 0.0001
  label_smoothing: 0.1
  scheduler: "cosine"
  use_class_weights: false
  patience: 20

env:
  platform: "kaggle"

kaggle:
  data_path: "/kaggle/input/datasets/doduyquynii/fer13-split/fer13-split"
  root_path: "/kaggle/working/sgu-2026-facial-expression-recognition"
