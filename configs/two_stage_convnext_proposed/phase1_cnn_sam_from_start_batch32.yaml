# Batch-size ablation for Phase 1 of the two-stage proposed workflow.
#
# This keeps the clean ConvNeXt-Tiny CNN recipe unchanged and only increases
# the global batch size from 16 to 32. With DDP and batch_size_is_global=true,
# a 2-GPU launch gives 16 samples per GPU.

data:
  batch_size: 32

