# One clean config for the full local 1-GPU recipe:
# Stage 1: ConvNeXt-Tiny CNN base from ImageNet for 60 epochs.
# Stage 2: MGR mask-guided region attention learned-only for 140 epochs.
#
# Run:
#   CUDA_VISIBLE_DEVICES=0 python scripts/run_two_stage_e2e.py --plan-config two_stage_convnext_proposed/local_1gpu_cnn60_mgr140_kaggle_parity_full_one_file
#
# Required local/server layout:
#   dataset/fer13-split/{train,val,test}.csv
#   dataset/bad_row_indices_drop345_mediapipe_failed.txt
#   dataset/mediapipe_region_masks/{train,val,test}

runner:
  env: "local"
  mode: "full"
  phase1_gpus: "1"
  phase2_gpus: "1"
  no_merge: false

  phase1_config: "two_stage_convnext_proposed/_generated_local1gpu_cnn60_mgr140_phase1"
  phase2_base_config: "two_stage_convnext_proposed/_generated_local1gpu_cnn60_mgr140_phase2.yaml"
  phase2_temp_name: "two_stage_convnext_proposed/_generated_local1gpu_cnn60_mgr140_phase2_with_ckpt.yaml"

phase1_yaml:
  _base_: "../convnext_tiny_fer2013_sam_cosine_from_start.yaml"

  paths:
    data_path: "dataset/fer13-split"
    output_dir: "outputs/two_stage_local1gpu_cnn60_mgr140/phase1_cnn"

  model:
    name: "convnext_tiny_fer2013"
    arch: "convnext_tiny"
    pretrained: true
    weights: "DEFAULT"
    checkpoint_path: null
    checkpoint_strict: false

  data:
    batch_size: 16
    num_workers: 2
    use_clean_filter: true
    bad_row_indices_path: "dataset/bad_row_indices_drop345_mediapipe_failed.txt"

  training:
    optimizer: "sam"
    base_optimizer: "adamw"
    sam_rho: 0.03
    sam_adaptive: false
    lr: 0.0002
    finetune_lr: 0.00008
    visual_extractor_lr: 0.000008
    scheduler: "cosine"
    epochs: 60
    patience: 0
    use_amp: false
    monitor: "val_accuracy"

  logging:
    use_wandb: false
    project_name: "FER2013"

phase2_yaml:
  _base_: "../convnext_tiny_mask_guided_region_attention_7462_sam_continue_learned_only.yaml"

  paths:
    data_path: "dataset/fer13-split"
    output_dir: "outputs/two_stage_local1gpu_cnn60_mgr140/phase2_mgr_learned_only"

  model:
    name: "convnext_tiny_mask_guided_region_attention"
    arch: "convnext_tiny"
    pretrained: false
    weights: null
    checkpoint_path: null
    checkpoint_strict: false

    use_source_classifier: false
    logit_fusion: "attention"
    finetune_logit_fusion: "attention"
    source_logit_weight: 0.0
    attention_logit_weight: 1.0
    use_clip_dictionary: false
    use_learnable_clip_region_tokens: false

    mask_guided_attention: true
    mask_attention_alpha: 0.3
    mask_floor: 0.05
    mask_dir: "dataset/mediapipe_region_masks"

    freeze_backbone_epochs: 4
    unfreeze_backbone: true
    unfreeze_backbone_scope: "all"
    freeze_unfrozen_batchnorm: true

  data:
    batch_size: 16
    num_workers: 2
    use_clean_filter: true
    bad_row_indices_path: "dataset/bad_row_indices_drop345_mediapipe_failed.txt"
    mask_dir: "dataset/mediapipe_region_masks"

  training:
    optimizer: "sam"
    base_optimizer: "adamw"
    sam_rho: 0.03
    sam_adaptive: false
    lr: 0.00008
    finetune_lr: 0.00004
    visual_extractor_lr: 0.000002
    weight_decay: 0.02
    scheduler: "cosine"
    epochs: 140
    patience: 0
    use_amp: false
    monitor: "val_accuracy"

  logging:
    use_wandb: false
    project_name: "FER2013"
