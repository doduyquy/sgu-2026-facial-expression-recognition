# Config riêng cho MLP Baseline (Baseline 1 — graph-level vector + MLP)
# Kế thừa base.yaml, chỉ ghi đè các giá trị cần thay đổi

model:
  name: "mlp_baseline"
  hidden_dims: [128, 64, 32]   # 9 -> 128 -> 64 -> 32 -> 7
  dropout: 0.3

training:
  epochs: 50
  patience: 10
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  optimizer: "adam"
  scheduler: "reduce_lr_on_plateau"   # giảm LR khi val_loss không giảm
  loss: "cross_entropy"

logging:
  use_wandb: false
