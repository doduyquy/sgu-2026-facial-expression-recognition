_base_: "paper_ablation_c_cnn_region_logits_080_020_imagenet_seed42_kaggle.yaml"

# E. CNN + region branch with wrong spatial prior.
# This keeps mask_attention_alpha active but permutes the six region-mask
# channels, so each region token receives a mismatched facial prior.

model:
  mask_attention_alpha: 0.3
  mask_ablation: "shuffle_regions"
  mask_region_permutation: [4, 2, 0, 5, 1, 3]

data:
  mask_ablation: "shuffle_regions"
  mask_region_permutation: [4, 2, 0, 5, 1, 3]

paths:
  output_dir: "/kaggle/working/outputs/paper_ablation_e_cnn_region_shuffled_mask_imagenet_seed42"
