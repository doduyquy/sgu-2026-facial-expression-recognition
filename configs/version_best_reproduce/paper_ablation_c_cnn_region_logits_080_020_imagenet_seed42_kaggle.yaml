_base_: "mgrcnn_imagenet_e2e_no_checkpoint_seed42_kaggle.yaml"

# C. Main claim: CNN logits + mask-guided regional logits.
# Both branches start from the same ImageNet ConvNeXt backbone; no FER
# checkpoint/source classifier is loaded.
#
# Final logits:
#   final = 0.8 * cnn_aux_logits + 0.2 * region_attention_logits

model:
  use_source_classifier: false
  use_cnn_aux_loss: true
  use_cnn_aux_logits: true
  cnn_aux_loss_weight: 0.4
  cnn_aux_hidden_dim: 768
  cnn_aux_dropout: 0.2

  logit_fusion: "cnn_aux_sum"
  finetune_logit_fusion: "cnn_aux_sum"
  attention_logit_weight: 0.2
  cnn_aux_logit_weight: 0.8

  mask_attention_alpha: 0.3
  mask_ablation: "none"

data:
  mask_ablation: "none"

paths:
  output_dir: "/kaggle/working/outputs/paper_ablation_c_cnn_region_logits_080_020_imagenet_seed42"
