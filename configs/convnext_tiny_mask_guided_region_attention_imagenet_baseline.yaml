_base_: "convnext_tiny_mask_guided_region_attention_7462_sam_continue_learned_only.yaml"

# Fair ImageNet-only ablation for:
# convnext_tiny_mask_guided_region_attention_7462_sam_continue_learned_only.yaml
#
# Keep the same mask-guided learned-only region-attention architecture and
# training recipe, but remove the FER 74.62 checkpoint. The only intended
# initialization difference is:
# - this file: ImageNet ConvNeXt-Tiny weights
# - 7462 learned-only file: FER-trained ConvNeXt 74.62 checkpoint as backbone

model:
  pretrained: true
  weights: "DEFAULT"
  checkpoint_path: null
  checkpoint_strict: false

  # Đóng băng 5 epoch đầu để "làm nóng" Attention head, 
  # sau đó BẮT BUỘC phải rã đông (unfreeze) backbone để nó học đặc trưng khuôn mặt.
  freeze_backbone_epochs: 5
  unfreeze_backbone: true
  unfreeze_backbone_scope: "all"
  freeze_unfrozen_batchnorm: true

training:
  optimizer: "adamw"
  lr: 0.0001
  finetune_lr: 0.00003
  visual_extractor_lr: 0.000005 # Learning rate nhỏ cho backbone sau khi rã đông
  epochs: 100
  patience: 20

ddp:
  sync_batchnorm: true
  batch_size_is_global: true
