_base_: "../version_best_reproduce/paper_ablation_e_cnn_region_shuffled_mask_imagenet_seed42_kaggle.yaml"

# Strong schedule version of E.
# Same as C, but the six region-mask channels are shuffled to test a wrong
# spatial prior.

model:
  freeze_backbone_epochs: 4
  unfreeze_backbone: true
  unfreeze_backbone_scope: "all"
  freeze_unfrozen_batchnorm: true

data:
  batch_size: 16
  num_workers: 2

training:
  optimizer: "sam"
  base_optimizer: "adamw"
  sam_rho: 0.03
  sam_adaptive: false

  lr: 0.0002
  finetune_lr: 0.00008
  visual_extractor_lr: 0.000008
  weight_decay: 0.02

  scheduler: "cosine"
  epochs: 70
  patience: 15
  label_smoothing: 0.05
  grad_clip_norm: 1.0
  skip_nonfinite_batches: true
  use_amp: false

paths:
  output_dir: "/kaggle/working/outputs/paper_ablation_strong_e_cnn_region_shuffled_mask_imagenet_seed42"
