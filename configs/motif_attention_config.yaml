# Motif with Region Attention and Confusion-Pair Learning Configuration

model:
  name: "motif_graph_fer"
  feat_dim: 128
  num_classes: 7
  motifs_per_class: 8
  top_k: 4
  dropout: 0.3
  use_region_attention: true

data:
  name: "fer13-split"
  num_classes: 7
  image_size: 48
  batch_size: 64
  num_workers: 4
  channels: 1
  mean: [0.5]
  std: [0.5]

seed: 
  random_seed: 42

training:
  epochs: 150
  lr: 0.001
  weight_decay: 1e-4
  loss: "confusion_combined"  # Focus on hard emotion pairs
  confusion_margin: 0.5  # Margin for hard pairs
  confusion_loss_weight: 0.6  # Weight of confusion loss vs CE
  
  # Label smoothing + class weights for imbalanced data
  label_smoothing: 0.1
  use_class_weights: true
  class_weight_mode: "sqrt_inverse"
  
  optimizer: "adam"
  scheduler: "reduce_lr_on_plateau"
  patience: 30
  lr_factor: 0.5
  lr_patience: 5
  
  # SCN (Sample Classification Network)
  use_scn: true
  scn_warmup_epochs: 10
  scn_alpha: 1.0
  scn_rank_lambda: 0.3
  scn_min_weight: 0.2
  scn_margin: 0.4


# Gentle augmentation for 48x48 images
augmentation:
  hflip_p: 0.3  # Reduce horizontal flip to preserve facial asymmetry
  rotation: 8   # Very gentle rotation
  perspective_scale: 0.05  # Minimal perspective distortion
  perspective_p: 0.2
  crop_scale: [0.95, 1.0]  # Tight crop to preserve details
