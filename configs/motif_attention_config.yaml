# Motif Graph FER with Region Attention + Confusion Learning
# Target: 73% accuracy on FER2013
# Improvements: Focus trên Fear/Sad confusion, region attention for micro-expressions

model:
  name: "motif_graph_fer"
  feat_dim: 128
  num_classes: 7
  motifs_per_class: 8
  top_k: 4
  dropout: 0.3
  
  # ===== Region Attention (NEW) =====
  use_region_attention: true
  num_attention_regions: 3  # mouth, eyes, face
  attention_channels: 64
  attention_dropout: 0.2

data:
  batch_size: 64
  num_workers: 4
  input_size: 48
  in_channels: 1

training:
  epochs: 150
  lr: 0.001
  weight_decay: 1e-4
  
  # ===== Loss Configuration =====
  loss: "confusion_combined"           # NEW: confusion loss
  
  # Cross-entropy + Label Smoothing
  label_smoothing: 0.1
  use_class_weights: true
  class_weight_mode: "sqrt_inverse"    # handle imbalanced classes
  
  # Motif Consistency Loss
  motif_loss_weight: 0.5
  motif_div_weight: 0.05
  motif_tau: 0.1
  
  # ===== Confusion Matrix Loss (NEW) =====
  confusion_loss_weight: 0.6
  confusion_margin: 0.5
  # Hard pairs to focus: Fear-Sad, Sad-Anger, Anger-Disgust
  
  # Scheduler & Early Stopping
  scheduler: "reduce_lr_on_plateau"
  patience: 30                          # CHANGED: more patience for early stopping
  factor: 0.5
  
  # SCN Configuration (có conflict với confusion loss, nhưng giữ để test)
  use_scn: true
  scn_warmup_epochs: 10
  scn_alpha: 1.0
  scn_rank_lambda: 0.15                 # REDUCED: avoid double up-weighting

# ===== Augmentation (SOFTENED for 48x48) =====
augmentation:
  flip: true
  flip_prob: 0.3
  
  rotation: 8                           # REDUCED: 10 → 8 (preserve micro-expressions)
  
  perspective: 0.05                     # REDUCED: 0.2 → 0.05
  perspective_prob: 0.3
  
  crop_scale: [0.95, 1.0]              # REDUCED: [0.8, 1.0] → [0.95, 1.0]
  
  affine_translate: [0.05, 0.05]       # Light shift
  
  color_jitter: false                   # Disable color jitter (grayscale)


