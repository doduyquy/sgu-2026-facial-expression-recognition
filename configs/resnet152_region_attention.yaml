_base_: "base.yaml"

model:
  name: "resnet152_region_attention"

  # Source checkpoint that already reaches about 73% as a plain ResNet152.
  # Warm-up starts from this backbone, then layer3 + layer4 are fine-tuned later.
  pretrained_resnet_path: "checkpoints/resnet152_rot30_2019Nov14_12.47"

  embed_dim: 512
  num_heads: 4
  num_regions: 6
  num_encoder_layers: 2
  transformer_dropout: 0.15

  # Multi-scale visual tokens:
  # layer3: [B, 1024, 14, 14] -> 196 tokens
  # layer4: [B, 2048, 7, 7]   -> 49 tokens
  # Both streams are projected to the same visual dim, then concatenated -> 245 tokens.
  feature_layer: "layer3_layer4"
  multiscale_visual_dim: 512
  pool_visual_tokens: false
  use_visual_pos_embed: true
  token_grid_size: 3
  fusion_type: "transformer"

  # CLIP gives K text/region query vectors, default K = num_regions = 6.
  use_clip_dictionary: true
  clip_model_name: "openai/clip-vit-base-patch32"

  # Pure attention branch: ResNet152 is used as the visual feature extractor only.
  logit_fusion: "attention"
  finetune_logit_fusion: "attention"
  attention_logit_weight: 1.0
  source_logit_weight: 0.0

  # Warm up the new attention head first, then fine-tune both top stages.
  freeze_backbone_epochs: 5
  unfreeze_backbone: true
  unfreeze_backbone_scope: "layer3_layer4"
  freeze_unfrozen_batchnorm: true

  # Preserve all 6 region tokens for the classifier instead of averaging them away.
  region_pooling: "concat"
  classifier_hidden_dim: 1024

  # Penalize large overlap between region attention maps more strongly.
  ortho_loss_type: "squared_offdiag"
  ortho_loss_weight: 0.01

data:
  image_size: 224
  channels: 3
  normalize: false
  batch_size: 8
  num_workers: 0

training:
  epochs: 60
  patience: 25
  monitor: "val_accuracy"
  loss: "cross_entropy"
  label_smoothing: 0.02
  optimizer: "adamw"
  lr: 0.0001
  visual_extractor_lr: 0.00001
  finetune_lr: 0.00002
  weight_decay: 0.0001
  scheduler: "reduce_lr_on_plateau"
  lr_factor: 0.5
  lr_patience: 5
  use_class_weights: false
  use_amp: true

logging:
  use_wandb: true

ddp:
  # Use with: torchrun --standalone --nproc_per_node=2 scripts/run_resnet152_region_attention.py ...
  # batch_size in data is treated as global batch size and split per GPU.
  batch_size_is_global: true
  find_unused_parameters: false
  broadcast_buffers: true
  sync_batchnorm: false
