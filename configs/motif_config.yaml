# Motif-based Graph FER Configuration

model:
  name: "motif_graph_fer"
  feat_dim: 128
  num_classes: 7
  motifs_per_class: 16
  top_k: 6
  offset_amplitude: 0.35
  dropout: 0.3

data:
  batch_size: 64
  num_workers: 4
  input_size: 48
  in_channels: 1

training:
  epochs: 1000
  lr: 0.0001
  weight_decay: 5e-4
  loss: "cross_entropy"
  label_smoothing: 0.1
  class_weight_mode: "sqrt_inverse"
  motif_consistency_weight: 0.05
  motif_diversity_weight: 0.05
  attn_entropy_weight: 0.01
  offset_reg_weight: 0.01
  motif_tau: 0.2
  scheduler: "reduce_lr_on_plateau"
  patience: 25
  factor: 0.5
  use_scn: true
  scn_warmup_epochs: 10
  scn_alpha: 1.0
  scn_rank_lambda: 0.5
  scn_margin: 0.6