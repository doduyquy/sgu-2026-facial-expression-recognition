# EMO-GNP (Emotion-aware Graph Network with Prototypes) Configuration

model:
  name: "emo_gnp"
  backbone_name: "convnextv2_tiny"
  feat_dim: 128
  num_classes: 7
  num_tokens: 16  # Semantic Region Queries
  motifs_per_class: 16
  dropout: 0.3

data:
  batch_size: 64
  num_workers: 4
  input_size: 48
  in_channels: 1

training:
  epochs: 100  # 3-phase strategy total
  warmup_epochs: 10
  hard_mining_start_epoch: 70
  lr: 0.001
  weight_decay: 1e-4
  loss: "emo_gnp_combined"
  ce_weight: 1.0
  circle_weight: 0.3
  circle_margin: 0.25
  circle_gamma: 256
  supcon_weight: 0.5
  repulsion_weight: 0.1
  motif_div_weight: 0.05
  motif_tau: 0.1
  use_ema: true
  ema_decay: 0.999
  scheduler: "cosine_annealing_warmup"
  use_scn: true
  scn_warmup_epochs: 10
  scn_alpha: 1.0
  scn_rank_lambda: 0.5
  scn_margin: 0.6
