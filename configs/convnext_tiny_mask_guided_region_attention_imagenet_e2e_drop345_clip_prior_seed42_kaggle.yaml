_base_: "base.yaml"

# Improved clean end-to-end ImageNet -> FER2013 training.
#
# This config inherits only base.yaml and stays checkpoint-free:
# - ConvNeXt-Tiny starts from torchvision ImageNet DEFAULT weights.
# - model.checkpoint_path is null.
# - training.init_checkpoint_path is null.
# - The 345 MediaPipe-failed train rows are dropped by original train.csv index.
#
# Difference from the learned-only E2E file:
# - add a small CLIP semantic prior for facial-region tokens
# - unfreeze ConvNeXt earlier
# - use a slightly less tiny backbone LR after unfreeze

seed:
  random_seed: 42

paths:
  data_path: "/kaggle/input/datasets/doduyquynii/fer13-split/fer13-split"
  output_dir: "/kaggle/working/outputs/imagenet_e2e_drop345_clip_prior/seed_42"

data:
  name: "fer13-split"
  num_classes: 7
  image_size: 224
  channels: 3
  normalize: true
  batch_size: 16
  num_workers: 2

  use_clean_filter: true
  bad_row_indices_path: "/kaggle/input/datasets/lhngphc/345-train-error/bad_row_indices_drop345_mediapipe_failed.txt"

  mask_dir: "/kaggle/input/datasets/lhongphuc2/mediapipe-mask-datasets-35887/merged_mediapipe_region_masks"

model:
  name: "convnext_tiny_mask_guided_region_attention"
  arch: "convnext_tiny"

  pretrained: true
  weights: "DEFAULT"
  checkpoint_path: null
  checkpoint_strict: false

  mask_dir: "/kaggle/input/datasets/lhongphuc2/mediapipe-mask-datasets-35887/merged_mediapipe_region_masks"

  use_swin_local_refiner: false
  use_multiscale_se_fusion: false
  use_layer4_se: false
  use_source_classifier: false
  logit_fusion: "attention"
  finetune_logit_fusion: "attention"
  source_logit_weight: 0.0
  attention_logit_weight: 1.0

  embed_dim: 384
  num_heads: 4
  num_regions: 6
  num_encoder_layers: 2
  transformer_dropout: 0.25
  fusion_type: "transformer"
  region_pooling: "concat"
  classifier_hidden_dim: 512

  pool_visual_tokens: false
  token_grid_size: 7
  use_visual_pos_embed: true
  use_region_slot_embed: true
  use_global_visual_bias: true
  use_global_feature_concat: false

  # ImageNet E2E improvement: learned tokens start from random, so keep a
  # small CLIP semantic prior and let the model learn its strength.
  use_clip_dictionary: true
  use_learnable_clip_region_tokens: true
  clip_model_name: "openai/clip-vit-base-patch32"
  clip_region_gamma_init: 0.1
  clip_region_gamma_learnable: true
  clip_fallback_to_learned: true

  mask_guided_attention: true
  mask_attention_alpha: 0.3
  mask_floor: 0.05

  freeze_backbone_epochs: 5
  unfreeze_backbone: true
  unfreeze_backbone_scope: "all"
  freeze_unfrozen_batchnorm: true

  classifier_dropout1: 0.40
  classifier_dropout2: 0.30
  ortho_loss_type: "squared_offdiag"
  ortho_loss_weight: 0.003


training:
  init_checkpoint_path: null
  init_checkpoint_strict: false

  epochs: 301
  
  patience: 40
  monitor: "val_accuracy"

  loss: "cross_entropy"
  label_smoothing: 0.05
  use_class_weights: false

  optimizer: "adamw"
  lr: 0.00008
  finetune_lr: 0.00003
  visual_extractor_lr: 0.000002
  weight_decay: 0.03

  scheduler: "reduce_lr_on_plateau"
  lr_factor: 0.5
  lr_patience: 3

  grad_clip_norm: 1.0
  skip_nonfinite_batches: true
  use_amp: false

logging:
  use_wandb: false
  project_name: "FER2013"

ddp:
  batch_size_is_global: true
  find_unused_parameters: false
  broadcast_buffers: true
  sync_batchnorm: true
