_base_: "convnext_tiny_region_attention_residual_7462_adamw.yaml"

model:
  # The first residual run peaked before unfreezing, then validation collapsed
  # after ConvNeXt features drifted away from the frozen source classifier.
  # Keep the 74.62 source path stable and train only the region correction head.
  freeze_backbone_epochs: 999
  unfreeze_backbone: false
  freeze_unfrozen_batchnorm: true

  # Make the residual branch conservative; it should correct hard samples,
  # not overpower the strong ConvNeXt classifier.
  source_logit_weight: 1.0
  attention_logit_weight: 0.1

  ortho_loss_weight: 0.002

training:
  optimizer: "adamw"
  lr: 0.0001
  finetune_lr: 0.00005
  visual_extractor_lr: 0.0
  epochs: 30
  patience: 8
  use_amp: false

