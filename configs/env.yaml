# Cấu hình môi trường (local / kaggle)
# Được merge flat vào config sau khi load base.yaml + model.yaml

local:
  data_path: "data/fer13-split"
  root_path: "."
  graph_cache_path: "outputs/graph_cache"
  num_workers: 0            # Windows: 0 tránh lỗi multiprocessing

kaggle:
  # Dataset CSV (dùng để build cache nếu cần):
  # https://www.kaggle.com/datasets/doduyquynii/fer13-split
  data_path: "/kaggle/input/datasets/doduyquynii/fer13-split"
  root_path: "/kaggle/working/sgu-2026-facial-expression-recognition"
  # Dataset .pt graph cache (add dataset vào notebook):
  # Thay YOUR_GRAPH_CACHE_DATASET bằng tên dataset thật
  graph_cache_path: "/kaggle/input/YOUR_GRAPH_CACHE_DATASET"
  num_workers: 2