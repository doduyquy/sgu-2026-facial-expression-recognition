# Cấu hình môi trường (local / kaggle)
# Được merge flat vào config sau khi load base.yaml + model.yaml

local:
  data_path: "data"
  root_path: "."
  # Graph repository v2 (canonical format, node_features = 7 dims)
  # Build bằng: python scripts/build_graph_repository.py ...
  graph_repo_path: "artifacts/graph_repo"
  # Precomputed subgraph-level graph dataset v2
  # Build bằng: python scripts/precompute_subgraph_graph_dataset.py ...
  subgraph_dataset_path: "artifacts/subgraph_graph_dataset"
  # Motif-filtered image-level dataset
  motif_filtered_dataset_path: "artifacts/motif_filtered_dataset_v1"
  # Pixel-preserving motif dataset V2
  pixel_motif_dataset_path: "artifacts/pixel_motif_dataset_v2"
  num_workers: 0            # Windows: 0 tránh lỗi multiprocessing

kaggle:
  # Dataset CSV FER-2013:
  # https://www.kaggle.com/datasets/doduyquynii/fer13-split
  data_path: "/kaggle/input/datasets/doduyquynii/fer13-split"
  root_path: "/kaggle/working/sgu-2026-facial-expression-recognition"
  # Graph repository v2 (canonical format — upload artifacts/graph_repo/ lên Kaggle):
  # Dataset name: "fer-graph-repo"
  # Upload path sau khi add dataset vào notebook:
  graph_repo_path: "/kaggle/input/fer-graph-repo/graph_repo"
  # Precomputed subgraph-level graph dataset (upload artifacts/subgraph_graph_dataset/ lên Kaggle)
  # Dataset name: "fer-subgraph-graph-dataset"
  subgraph_dataset_path: "/kaggle/input/fer-subgraph-graph-dataset"
  # Motif-filtered dataset (upload artifacts/motif_filtered_dataset_v1/ lên Kaggle)
  motif_filtered_dataset_path: "/kaggle/input/fer-motif-filtered-dataset/motif_filtered_dataset_v1"
  # Pixel-preserving motif dataset V2
  pixel_motif_dataset_path: "/kaggle/input/fer-pixel-motif-dataset/pixel_motif_dataset_v2"
  num_workers: 2
