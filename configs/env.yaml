# Cấu hình môi trường (local / kaggle)
# Được merge flat vào config sau khi load base.yaml + model.yaml

local:
  data_path: "data"
  root_path: "."
  # Graph repository mới (canonical format)
  # Build bằng: python scripts/build_graph_repository.py ...
  graph_repo_path: "artifacts/graph_repo"
  num_workers: 0            # Windows: 0 tránh lỗi multiprocessing

kaggle:
  # Dataset CSV FER-2013:
  # https://www.kaggle.com/datasets/doduyquynii/fer13-split
  data_path: "/kaggle/input/datasets/doduyquynii/fer13-split"
  root_path: "/kaggle/working/sgu-2026-facial-expression-recognition"
  # Graph repository (canonical format — upload artifacts/graph_repo/ lên Kaggle):
  # Dataset name: "fer-graph-repo"
  # Upload path sau khi add dataset vào notebook:
  graph_repo_path: "/kaggle/input/fer-graph-repo/graph_repo"
  num_workers: 2