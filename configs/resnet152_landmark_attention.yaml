_base_: "base.yaml"

model:
  name: "resnet152_landmark_attention"

  # Source checkpoint that already reaches about 73% as a plain ResNet152.
  pretrained_resnet_path: "checkpoints/resnet152_rot30_2019Nov14_12.47"

  embed_dim: 512
  num_heads: 4
  num_regions: 6
  num_encoder_layers: 2
  transformer_dropout: 0.2

  # Match the strongest region-attention baseline for a fair comparison:
  # layer4 gives [B, 2048, 7, 7] -> 49 visual tokens.
  feature_layer: "layer4"
  pool_visual_tokens: false
  use_visual_pos_embed: true
  token_grid_size: 3
  fusion_type: "transformer"
  landmark_sigma: 1.0

  # CLIP text embeddings initialize 6 region queries with semantic meaning.
  use_clip_dictionary: true
  clip_model_name: "openai/clip-vit-base-patch32"

  # Pure attention branch — ResNet is only used as a feature extractor.
  logit_fusion: "attention"
  finetune_logit_fusion: "attention"
  attention_logit_weight: 1.0
  source_logit_weight: 0.0

  # Mirror the strongest region-attention recipe, then compare one variable:
  # whether landmark-guided cross-attention helps.
  freeze_backbone_epochs: 5
  unfreeze_backbone: true
  unfreeze_backbone_scope: "layer4"
  freeze_unfrozen_batchnorm: true

  # Concat preserves per-region identity for the classifier.
  region_pooling: "concat"
  classifier_hidden_dim: 1024

  # Keep the same diversity penalty as the best plain region-attention run.
  ortho_loss_type: "squared_offdiag"
  ortho_loss_weight: 0.02

data:
  image_size: 224
  channels: 3
  normalize: false
  batch_size: 8
  num_workers: 0
  cache_landmark_masks: true

training:
  epochs: 60
  patience: 25
  monitor: "val_accuracy"
  loss: "cross_entropy"
  label_smoothing: 0.05
  optimizer: "adamw"
  lr: 0.0001
  visual_extractor_lr: 0.00001
  finetune_lr: 0.00002
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  skip_nonfinite_batches: true
  scheduler: "reduce_lr_on_plateau"
  lr_factor: 0.5
  lr_patience: 5
  use_class_weights: false
  use_amp: true

logging:
  use_wandb: true

ddp:
  batch_size_is_global: true
  find_unused_parameters: false
  broadcast_buffers: true
  sync_batchnorm: false
