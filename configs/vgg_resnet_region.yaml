
# Region-Aligned Facial Expression Recognition Configuration
_base_: "base.yaml"

model:
  name: "region_aligned_fer"
  embed_dim: 512
  num_heads: 4
  num_regions: 6          # Trán, Mắt trái, Mắt phải, Mũi, Miệng, Cằm
  num_encoder_layers: 2   # Số lớp Transformer Encoder
  transformer_dropout: 0.2
  
  # Region Attention Config
  cross_attention_direction: "visual_query" # Q = 18 visual tokens, K/V = 6 region tokens
  use_clip_dictionary: false
  fusion_type: "swin" # Cross-attention xong đưa 18 tokens qua shifted axis-window 3x6 encoder
  clip_model_name: "openai/clip-vit-base-patch32"
  ortho_loss_weight: 0.015 # Tăng nhẹ để phân tách vùng tốt hơn


  # VGG Backbone (giữ Spatial Attention để khớp với checkpoint 69.2%)
  use_aux: false
  use_attention: true

  # ResNet Backbone (giữ CBAM để khớp với checkpoint 68.5%)
  attention_type: "cbam"
  attention_kernel_size: 7
  use_fusion: true

  # ── Transfer Learning ──
  pretrained_vgg_path: "/kaggle/input/datasets/lhngphc/vgg-0-912/vgg_spatial_10042026_1053_best.pth"
  pretrained_resnet_path: "/kaggle/input/datasets/lhngphc/resnet-0-68/resnet50_12042026_1052_best.pth"

  # Số epoch đóng băng backbone (Phase 1: chỉ train Region Head)
  freeze_backbone_epochs: 20

data:
  image_size: 48
  channels: 1
  batch_size: 64

training:
  loss: "focal"        # Dùng Focal Loss trị các class khó
  lr: 0.0001
  finetune_lr: 0.00002
  epochs: 100
  optimizer: "sam"
  base_optimizer: "adamw"
  sam_rho: 0.05
  weight_decay: 0.08       # Tăng penalty chống overfit
  label_smoothing: 0.2     # Tăng label smoothing để giảm độ tin cậy của nhiễu
  scheduler: "cosine"
  use_class_weights: true

env:
  platform: "kaggle"

ddp:
  batch_size_is_global: true
  find_unused_parameters: false
  broadcast_buffers: true
  sync_batchnorm: false

kaggle:
  data_path: "/kaggle/input/datasets/doduyquynii/fer13-split/fer13-split"
  root_path: "/kaggle/working/sgu-2026-facial-expression-recognition"
