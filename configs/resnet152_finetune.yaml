_base_: "base.yaml"

model:
  name: "resnet152"
  checkpoint_path: "/kaggle/input/datasets/lhngphc/resnet152-0-73/resnet152_rot30_2019Nov14_12.47"
  reset_classifier: false
  head_type: "mlp"
  head_hidden_dim: 512
  head_dropout: 0.2
  freeze_backbone: true
  trainable_backbone_layers: ["layer4"]
  unfreeze_epoch: null

data:
  image_size: 224
  channels: 3
  normalize: false
  batch_size: 64
  num_workers: 2

training:
  epochs: 35
  patience: 8
  monitor: "val_accuracy"
  loss: "cross_entropy"
  label_smoothing: 0.05
  optimizer: "adamw"
  lr: 0.0001
  finetune_lr: 0.00005
  weight_decay: 0.0001
  scheduler: "reduce_lr_on_plateau"
  lr_factor: 0.5
  lr_patience: 2
  use_class_weights: false

logging:
  use_wandb: false

paths:
  data_path: "/kaggle/input/datasets/doduyquynii/fer13-split/fer13-split"
  output_dir: "/kaggle/working/outputs"
