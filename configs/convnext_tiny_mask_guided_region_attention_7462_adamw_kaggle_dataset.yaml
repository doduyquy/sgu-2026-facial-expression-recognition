_base_: "convnext_tiny_mask_guided_region_attention_7462_adamw.yaml"

# Kaggle Add Input layout from the current notebook:
# - Convnext_74.62 contains convnext_tiny_fer2013_15052026_valaccuracy73.59.pth
# - fer13-split contains train.csv, val.csv, test.csv
# - mediapipe_mask_datasets contains mediapipe_region_masks/{train,val,test}
#
# The 74.62 checkpoint path is inherited from the base config as a repo-local
# basename. On Kaggle, ConvNeXtRegionAttentionFER discovers the same basename
# recursively under /kaggle/input, so this config works even if the dataset slug
# is convnext-74-62, convnext-7462, or another wrapper folder.

paths:
  data_path: "/kaggle/input/datasets/doduyquynii/fer13-split/fer13-split"

model:
  mask_dir: "/kaggle/input/datasets/lhongphuc3/mediapipe-mask-datasets/mediapipe_region_masks"

data:
  mask_dir: "/kaggle/input/datasets/lhongphuc3/mediapipe-mask-datasets/mediapipe_region_masks"
