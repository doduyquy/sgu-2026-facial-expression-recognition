_base_: "convnext_tiny_mask_guided_region_attention_7462_adamw.yaml"

model:
  # Cross-dataset/generalization phase 1:
  # start from ImageNet ConvNeXt-Tiny, not from any FER-trained checkpoint.
  pretrained: true
  weights: "DEFAULT"
  checkpoint_path: null
  checkpoint_strict: false

  # ConvNeXt remains the CNN backbone. Train the region/mask head first, then
  # gently adapt the ImageNet features with a tiny visual LR.
  freeze_backbone_epochs: 4
  unfreeze_backbone: true
  unfreeze_backbone_scope: "all"
  freeze_unfrozen_batchnorm: true

  # Keep the geometric prior soft at the beginning; it guides attention without
  # forcing it if MediaPipe/Face Mesh is imperfect.
  mask_attention_alpha: 0.3
  mask_floor: 0.05
  mask_dir: "outputs/mediapipe_region_masks"

data:
  batch_size: 16
  num_workers: 2
  use_clean_filter: false
  mask_dir: "outputs/mediapipe_region_masks"

training:
  optimizer: "adamw"
  lr: 0.0001
  finetune_lr: 0.00005
  visual_extractor_lr: 0.000002
  weight_decay: 0.02

  scheduler: "reduce_lr_on_plateau"
  lr_factor: 0.5
  lr_patience: 2
  epochs: 45
  patience: 10
  use_amp: true
