# Config mặc định CHUNG cho toàn bộ project GNN FER-2013
# Các file config yaml khác sẽ inherit thằng này và ghi đè lại
# ----------- ----------- -----------

data:
  name: "fer13-split"
  mode: "graph_vector"
  num_classes: 7    # angry, disgust, fear, happy, neutral, sad, surprise
  image_size: 48
  batch_size: 128
  num_workers: 2    # Kaggle: 2 | Windows local: 0
  num_subgraphs: 16
  subgraph_radius: 1
  seed_stride: 4
  max_candidates: 64
  max_nodes_per_subgraph: null

seed:
  random_seed: 42

graph:
  connectivity: 8         # 4 hoặc 8
  normalize_pixels: true  # normalize về [0, 1]
  node_feature_names:
    - "intensity"
    - "x_norm"
    - "y_norm"
    - "gx"
    - "gy"
    - "grad_mag"
    - "local_contrast"
  edge_static_feature_names:
    - "dx"
    - "dy"
    - "dist"
  edge_dynamic_feature_names:
    - "delta_intensity"
    - "intensity_similarity"
  intensity_similarity_alpha: 1.0
  chunk_size: 500

model:
  name: "mlp_baseline"   # key trong MODEL_REGISTRY
  hidden_dims: [64, 32]
  dropout: 0.2

training:
  epochs: 30
  patience: 10
  weight_decay: 0.0001
  loss: "cross_entropy"
  optimizer: "adam"      # adam | sgd
  lr: 0.001
  scheduler: "none"      # none | step | cosine | reduce_lr_on_plateau

# !!! WARNING !!!
logging:
  use_wandb: false
  wandb_entity: "phucga15062005"
  wandb_project: "GNN-FER2013"

# !!! WARNING !!!
env:
  platform: "kaggle"    # local | kaggle  <--- MẶC ĐỊNH KAGGLE

# !!! WARNING !!!
kaggle:
  data_path: "/kaggle/input/datasets/doduyquynii/fer13-split"
  root_path: "/kaggle/working/sgu-2026-facial-expression-recognition"
  # Graph repository v2 (canonical format — chunks + shared graph, node_features = 7 dims)
  # Upload artifacts/graph_repo/ lên Kaggle, đặt tên dataset "fer-graph-repo"
  graph_repo_path: "/kaggle/input/fer-graph-repo/graph_repo"

local:
  data_path: "data"
  root_path: "."
  # Graph repository v2 (build bằng scripts/build_graph_repository.py)
  graph_repo_path: "artifacts/graph_repo"
