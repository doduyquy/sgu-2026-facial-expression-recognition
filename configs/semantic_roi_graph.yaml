model:
  name: "semantic_roi_graph_fer"
  num_classes: 7
  num_regions: 9
  roi_grid: 4
  feature_dim: 256
  motif_per_class: 4
  use_pretrained: true
  backbone_out_size: 12
  bbox_input_size: 48
  micro_layers: 2
  macro_layers: 2
  attn_heads: 4
  dropout: 0.1
  label_smoothing: 0.05

data:
  batch_size: 64
  num_workers: 2
  input_size: 48
  in_channels: 1
  use_semantic_masks: true
  # For Kaggle, point this to your generated semantic mask folder
  semantic_masks_dir: "/kaggle/working/semantic_masks"

training:
  epochs: 120
  lr: 0.0003
  weight_decay: 0.0005
  loss: "semantic_roi_graph"
  label_smoothing: 0.05
  scheduler: "cosine"
  patience: 20
  class_weight_mode: "sqrt_inverse"
  use_class_weights: true
  # Loss weights for the semantic ROI graph model
  motif_diversity_weight: 0.05
  au_contrastive_weight: 0.1
  region_consistency_weight: 0.1

logging:
  use_wandb: true
