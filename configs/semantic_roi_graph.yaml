model:
  name: "semantic_roi_graph_fer"
  num_classes: 7
  num_regions: 9
  roi_grid: 4
  feature_dim: 256
  # micro_motifs_per_region: local motif templates per facial region
  micro_motifs_per_region: 8
  # macro_motifs_per_class: semantic program slots per emotion class
  macro_motifs_per_class: 4
  use_pretrained: true
  backbone_out_size: 12
  bbox_input_size: 48
  micro_layers: 2
  macro_layers: 2
  attn_heads: 4
  dropout: 0.35   # increased from 0.25 to combat train-val-test overfitting gap
  label_smoothing: 0.05
  region_dropout_prob: 0.1  # randomly drops 10% of facial regions during training for robust routing
  relation_temperature: 0.07
  # Semantic compositional model hyperparameters
  semantic_state_dim: 128
  semantic_latent_dim: 256
  semantic_attn_heads: 4      # must divide semantic_state_dim (128 / 4 = 32 ✓)
  hyperedge_count: 4          # Fix 4: was missing, silently used dataclass default
  router_hidden_dim: 256
  cross_region_compositions: 8
  programs_per_class: 4
  program_dim: 128
  fusion_scale: 0.25

data:
  batch_size: 64
  num_workers: 2
  input_size: 48
  in_channels: 1
  use_semantic_masks: true
  # Path to semantic mask folder. Use relative path inside repo for local runs.
  # e.g. dataset/semantic_masks which contains train/, val/, test/ subfolders.
  semantic_masks_dir: "/kaggle/input/datasets/pha1t2/maskfer2013/semantic_masks"

training:
  epochs: 1000
  lr: 0.00005
  weight_decay: 0.01
  loss: "semantic_roi_graph"
  label_smoothing: 0.05
  class_weight_mode: "sqrt_inverse"
  use_class_weights: true

  # ── Loss enable flags (light preset) ──────────────────────────────────────
  # Only 3 auxiliary losses are active. All others disabled to reduce overfit.
  enable_micro_diversity: true
  enable_macro_diversity: true
  enable_region_contrastive: true
  enable_semantic_consistency: true
  enable_compositional_program: true
  enable_semantic_disentanglement: false
  enable_region_coordination: false
  enable_topology_alignment: false
  enable_region_composition_contrastive: false
  enable_program_sparsity: True
  enable_program_diversity: true

  # Scenario E-base: fused branch disabled
  enable_fused_aux_ce: true

  # ── Weights for enabled losses ─────────────────────────────────────────────
  micro_motif_diversity_weight: 0.02
  macro_motif_diversity_weight: 0.02
  semantic_consistency_weight: 0.03
  compositional_program_weight: 0.02
  program_diversity_weight: 0.01
  fused_aux_ce_weight: 0.05

  # Disabled weights (kept for reference / easy re-enable)
  region_contrastive_weight: 0.01
  semantic_disentanglement_weight: 0.0
  region_coordination_weight: 0.0
  topology_alignment_weight: 0.0
  region_composition_contrastive_weight: 0.0
  program_sparsity_weight: 0.02

  use_entropy_sparsity: false

logging:
  use_wandb: true