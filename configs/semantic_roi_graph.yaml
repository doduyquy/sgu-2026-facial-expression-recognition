model:
  name: "semantic_roi_graph_fer"
  num_classes: 7
  num_regions: 9
  roi_grid: 4
  feature_dim: 256
  motif_per_class: 4
  micro_motifs_per_region: 8
  macro_motifs_per_class: 4
  use_pretrained: true
  backbone_out_size: 12
  bbox_input_size: 48
  micro_layers: 2
  macro_layers: 2
  attn_heads: 4
  dropout: 0.1
  label_smoothing: 0.05
  relation_temperature: 0.07
  # Semantic compositional model hyperparameters (added for new architecture)
  semantic_state_dim: 128
  semantic_latent_dim: 256
  semantic_attn_heads: 4
  router_hidden_dim: 256
  cross_region_compositions: 8
  programs_per_class: 4
  program_dim: 128

data:
  batch_size: 64
  num_workers: 2
  input_size: 48
  in_channels: 1
  use_semantic_masks: true
  # Path to semantic mask folder. Use relative path inside repo for local runs
  # e.g. dataset/semantic_masks which contains train/, val/, test/ subfolders.
  semantic_masks_dir: "/kaggle/input/datasets/pha1t2/maskfer2013/semantic_masks"

training:
  epochs: 1000
  lr: 0.0003
  weight_decay: 0.0005
  loss: "semantic_roi_graph"
  label_smoothing: 0.05
  scheduler: "cosine"
  patience: 20
  class_weight_mode: "sqrt_inverse"
  use_class_weights: true
  # Loss weights for the semantic ROI graph model
  micro_motif_diversity_weight: 0.05
  macro_motif_diversity_weight: 0.05
  region_contrastive_weight: 0.1
  relation_consistency_weight: 0.1
  topology_reg_weight: 0.01
  # New loss weights for semantic compositional program training
  semantic_consistency_weight: 0.1
  compositional_motif_weight: 0.1
  semantic_disentanglement_weight: 0.01
  region_coordination_weight: 0.1
  compositional_program_weight: 0.1
  topology_alignment_weight: 0.1
  region_composition_contrastive_weight: 0.1
  program_sparsity_weight: 0.05
  program_diversity_weight: 0.05
  # Use entropy-based sparsity (True) to encourage load-balancing across hyperedges
  use_entropy_sparsity: false

logging:
  use_wandb: true
