data:
  mode: motif_filtered
  motif_filtered_dataset_path: artifacts/motif_filtered_dataset_v1
  batch_size: 64
  num_workers: 2
  pin_memory: true

model:
  name: motif_guided_gnn
  input_dim: null
  hidden_dim: 128
  gnn_hidden_dim: 128
  num_layers: 2
  num_classes: 7
  dropout: 0.3
  use_edge_attr: false
  use_motif_score_vector: true
  use_match_score_feature: true
  use_match_score_weighting: true
  pooling: motif_attention

loss:
  name: weighted_ce_motif
  use_class_weights: true
  class_weight_power: 1.0
  class_counts: [3995, 436, 4097, 7215, 4830, 3171, 4965]
  lambda_motif: 0.1
  margin: 0.2

optimizer:
  name: AdamW
  lr: 0.0005
  weight_decay: 0.0001

scheduler:
  name: ReduceLROnPlateau
  mode: max
  monitor: val_macro_f1
  factor: 0.5
  patience: 5
  min_lr: 0.000001

training:
  epochs: 80
  early_stopping_patience: 15
  monitor: val_macro_f1
  grad_clip_norm: 5.0

logging:
  use_wandb: true
