seed: 42
device: cuda
output_dir: /kaggle/working/outputs/rafdb_convnext_tiny_base_imagefolder_seed42

data:
  root: /kaggle/input/datasets/shuvoalok/raf-db-dataset/DATASET
  image_size: 224
  resize_size: 256
  batch_size: 32
  eval_batch_size: 64
  num_workers: 2
  val_fraction: 0.10
  drop_last: false
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  arch: convnext_tiny
  pretrained: true
  weights: DEFAULT
  fallback_to_random_weights: true

training:
  epochs: 70
  patience: 15
  optimizer: adamw
  lr: 0.00008
  weight_decay: 0.02
  scheduler: cosine
  min_lr: 0.000001
  label_smoothing: 0.05
  use_amp: true

logging:
  progress_bar: false

augmentation:
  train:
    enabled: true
    random_resized_crop_scale: [0.80, 1.00]
    hflip_prob: 0.5
    rotation_degrees: 10
    color_jitter:
      brightness: 0.15
      contrast: 0.15
      saturation: 0.10
      hue: 0.02
    random_erasing_prob: 0.10

mask:
  enabled: false
  mode: none
  note: "Clean RAF-DB ConvNeXt-Tiny CNN baseline: RGB image -> ConvNeXt-Tiny ImageNet -> linear 7-class head. No mask, no region branch, no fusion."

rafdb_mapping:
  "1": Surprise
  "2": Fear
  "3": Disgust
  "4": Happiness
  "5": Sadness
  "6": Anger
  "7": Neutral
