# Proposed graph experiment: same 48x48/1-channel ConvNeXt-SCN baseline,
# replacing only dense graph propagation with reliability-gated sparse dynamics.
seed:
  random_seed: 42

model:
  name: "convnext_48_reliability_sparse_graph"
  backbone: "convnext_tiny"
  num_classes: 7
  in_channels: 1
  embed_dim: 256
  num_attn_heads: 8
  use_spatial_attention: true
  use_latent_graph: true
  graph_mode: "reliability_sparse"
  graph_topk: 3              # self-loop + three learned neighbours per regional node
  graph_self_loop_bias: 1.0
  dropout: 0.30
  classifier_type: "linear"
  use_pretrained: true
  stem_init: "mean"
  pretrained_weights_path: ""

scn:
  use_scn: true
  margin: 0.15
  clean_ratio: 0.70
  rank_loss_weight: 0.10
  div_loss_weight: 0.05
  sparsity_loss_weight: 0.0  # structure is already explicitly top-k sparse
  rank_warmup_epochs: 5
  enable_relabel: false
  relabel_epoch: 25
  relabel_threshold: 0.90
  relabel_max_alpha: 0.20

data:
  data_path: "dataset/fer13-split"
  batch_size: 64
  num_workers: 2
  input_size: 48
  normalization: "symmetric"
  use_random_erasing: true
  erasing_prob: 0.30
  use_mixup: true
  mixup_alpha: 0.2
  mixup_prob: 0.5

training:
  epochs: 200
  lr: 0.0003
  weight_decay: 0.002
  label_smoothing: 0.05
  scheduler: "cosine_annealing"
  eta_min: 0.000001
  patience: 25
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 2.0
  no_weight_decay_norm_bias: true
  eval_test_on_best_epoch: false
  use_class_weights: true
  class_weight_mode: "sqrt_inverse"
  output_dir: "outputs/convnext_48_reliability_sparse_graph"

logging:
  wandb_project: "fer2013-fads-scn"
  wandb_mode: "disabled"
