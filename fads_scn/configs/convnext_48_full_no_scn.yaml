# Ablation 2: Full ConvNeXt + spatial attention + graph, but plain CE (no SCN weighting/ranking).
seed:
  random_seed: 42

model:
  name: "convnext_48_full_no_scn"
  backbone: "convnext_tiny"
  num_classes: 7
  in_channels: 1
  embed_dim: 256
  num_attn_heads: 8
  use_spatial_attention: true
  use_latent_graph: true
  dropout: 0.30
  classifier_type: "linear"
  use_pretrained: true
  stem_init: "mean"
  pretrained_weights_path: ""

scn:
  use_scn: false
  rank_loss_weight: 0.0
  div_loss_weight: 0.05
  sparsity_loss_weight: 0.0

data:
  data_path: "dataset/fer13-split"
  batch_size: 64
  num_workers: 2
  input_size: 48
  normalization: "symmetric"
  use_random_erasing: true
  erasing_prob: 0.30
  use_mixup: true
  mixup_alpha: 0.2
  mixup_prob: 0.5

training:
  epochs: 200
  lr: 0.0003
  weight_decay: 0.002
  label_smoothing: 0.05
  scheduler: "cosine_annealing"
  eta_min: 0.000001
  patience: 30
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 2.0
  no_weight_decay_norm_bias: true
  eval_test_on_best_epoch: false
  use_class_weights: true
  class_weight_mode: "sqrt_inverse"
  output_dir: "outputs/convnext_48_full_no_scn"
