model:
  name: "attentive_scn_fer"
  backbone: "convnext_tiny"       # Modernized 2020s CNN with 7x7 depthwise conv, GELU, LayerNorm
  num_classes: 7
  in_channels: 1                 # 48x48 grayscale
  embed_dim: 256
  num_attn_heads: 8              # 8 soft semantic tokens acting as dynamic graph nodes
  use_latent_graph: true         # Latent Dynamic Graph reasoning over soft tokens
  dropout: 0.30
  use_pretrained: true
  pretrained_weights_path: ""    # Optional: path to facial-pretrained weights (.pth)

scn:
  margin: 0.15                   # Margin gamma for rank regularization
  clean_ratio: 0.70              # Top 70% lowest loss treated as confident/clean
  rank_loss_weight: 0.10         # Weight lambda for rank regularization loss
  div_loss_weight: 0.05          # Spatial head diversity regularizer
  sparsity_loss_weight: 0.0      # Edge sparsity regularizer
  rank_warmup_epochs: 0          # Active from epoch 0
  enable_relabel: false          # Safe mode: Disable permanent label rewriting to prevent label drift / confirmation bias
  relabel_epoch: 25              # (If enabled) Start dynamic relabeling after epoch 25
  relabel_threshold: 0.90        # (If enabled) Ultra-high confidence threshold (>= 90%)
  relabel_max_alpha: 0.20        # (If enabled) Only relabel if alpha is extremely low (< 0.20)

data:
  data_path: "dataset/fer13-split"
  batch_size: 64
  num_workers: 2
  input_size: 48
  use_random_erasing: true       # Mask small random patches to force multi-region focus
  erasing_prob: 0.30
  use_mixup: true                # Mixup Data Augmentation (alpha=0.2) to prevent memorization
  mixup_alpha: 0.2
  mixup_prob: 0.5                # Apply mixup on 50% of training batches

training:
  epochs: 200
  lr: 0.0003
  weight_decay: 0.002
  label_smoothing: 0.05
  scheduler: "cosine_annealing"  # Smooth CosineAnnealingLR (decay 0.0003 -> 1e-6 without shock restart)
  eta_min: 0.000001
  patience: 30
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 2.0
  use_class_weights: true
  class_weight_mode: "sqrt_inverse"
  output_dir: "outputs/fads_scn_convnext"

logging:
  wandb_project: "fer2013-fads-scn"
  wandb_mode: "disabled"
