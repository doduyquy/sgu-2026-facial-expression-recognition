seed:
  random_seed: 42

model:
  name: "attentive_scn_fer"
  backbone: "convnext_tiny"
  num_classes: 7
  in_channels: 3                 # RAF-DB contains RGB aligned face images
  embed_dim: 256
  num_attn_heads: 8
  use_latent_graph: true
  use_spatial_attention: true
  dropout: 0.30
  classifier_type: "linear"
  use_pretrained: true
  stem_init: "mean"
  pretrained_weights_path: ""

scn:
  margin: 0.15
  clean_ratio: 0.70
  rank_loss_weight: 0.05         # RAF-DB labels are cleaner than FER2013
  div_loss_weight: 0.05
  sparsity_loss_weight: 0.0
  rank_warmup_epochs: 5
  enable_relabel: false
  relabel_epoch: 25
  relabel_threshold: 0.90
  relabel_max_alpha: 0.20

data:
  dataset: "rafdb"
  data_path: "RAF-DB DATASET/DATASET"
  label_encoding: "auto"        # Supports official 1..7 or zero-based RAF order
  val_ratio: 0.10                # Stratified split from official training set
  split_seed: 42
  batch_size: 32
  num_workers: 2
  input_size: 96                 # Close to RAF-DB aligned image native resolution
  color_mode: "rgb"
  normalization: "imagenet"
  augmentation_profile: "rafdb"
  use_random_erasing: true
  erasing_prob: 0.20
  use_mixup: true
  mixup_alpha: 0.2
  mixup_prob: 0.30

training:
  epochs: 100
  lr: 0.0002
  weight_decay: 0.002
  label_smoothing: 0.10
  scheduler: "cosine_annealing"
  eta_min: 0.000001
  patience: 20
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 2.0
  no_weight_decay_norm_bias: true
  eval_test_on_best_epoch: false
  use_class_weights: true
  class_weight_mode: "sqrt_inverse"
  output_dir: "outputs/fads_scn_convnext_rafdb"

calibration:
  enable_logit_bias: false       # FER2013 bias grid must not be reused on RAF-DB
  metric: "hybrid"
  search_on: "val"
  use_tta: "flip"
  class_names: ["angry", "disgust", "fear", "happy", "sad", "surprise", "neutral"]

logging:
  wandb_project: "rafdb-fads-scn"
  wandb_mode: "disabled"
